<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/assets/logo-symbol.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yaqeel — Modern Tuition & Institute Management App</title>
    <meta name="description" content="Run your tuition centre smoothly. Manage student attendance, fees, exams, and teacher payroll from your mobile phone." />
    <link rel="canonical" href="https://www.yaqeel.com/" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.yaqeel.com/" />
    <meta property="og:site_name" content="Yaqeel" />
    <meta property="og:title" content="Yaqeel — Modern Tuition & Institute Management App" />
    <meta property="og:description" content="Run your tuition centre smoothly. Manage student attendance, fees, exams, and teacher payroll from your mobile phone." />
    <meta property="og:image" content="https://www.yaqeel.com/assets/yaqeel-banner.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.yaqeel.com/" />
    <meta name="twitter:title" content="Yaqeel — Modern Tuition & Institute Management App" />
    <meta name="twitter:description" content="Run your tuition centre smoothly. Manage student attendance, fees, exams, and teacher payroll from your mobile phone." />
    <meta name="twitter:image" content="https://www.yaqeel.com/assets/yaqeel-banner.png" />

    <!-- Schema.org Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.yaqeel.com/#organization",
          "name": "Yaqeel",
          "url": "https://www.yaqeel.com/",
          "logo": "https://www.yaqeel.com/assets/logo.png",
          "sameAs": [
            "https://www.instagram.com/yaqeel.ai/",
            "https://linkedin.com/company/yaqeel"
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+91-8590028549",
            "contactType": "customer service",
            "areaServed": "IN",
            "availableLanguage": ["English", "Malayalam", "Hindi"]
          },
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Calicut",
            "addressRegion": "Kerala",
            "addressCountry": "IN"
          }
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://www.yaqeel.com/#software",
          "name": "Yaqeel",
          "operatingSystem": "iOS, Android, Web",
          "applicationCategory": "EducationalApplication",
          "offers": {
            "@type": "Offer",
            "price": "60",
            "priceCurrency": "INR"
          }
        }
      ]
    }
    </script>

    <!-- Google Fonts: Plus Jakarta Sans & Inter with display swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-paper text-ink antialiased font-sans overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
